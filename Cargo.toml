[package]
name = "citop"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/xfbs/citop"
description = "Interactive CI pipeline viewer"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
globset = "0.4.22"
humantime = "2.4.0"
humantime-serde = "1.1.1"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "query", "gzip", "system-proxy"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
toml = "1.2.3"
url = { version = "2.5.9", features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
